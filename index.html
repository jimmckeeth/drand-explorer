<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>drand Explorer</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="style.css" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = JSON.parse(localStorage.getItem('drand-explorer:v1') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">◈</span>
        <div>
          <h1>drand Explorer</h1>
          <p>Distributed randomness beacons</p>
        </div>
      </div>
      <div class="controls">
        <label>
          <span>Copy as</span>
          <select id="outputMode">
            <option value="url">URL</option>
            <option value="curl">cURL</option>
            <option value="cli">wget</option>
          </select>
        </label>
        <button type="button" id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">◐</button>
      </div>
    </header>

    <div class="statusbar" id="status" role="status">Loading beacons…</div>

    <div class="layout">
      <nav class="sidebar" aria-label="Beacons">
        <h2>Beacons</h2>
        <ul id="beaconList" class="beacon-list"></ul>
      </nav>
      <main id="detail" class="detail" aria-live="polite"></main>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
