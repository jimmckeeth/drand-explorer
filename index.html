<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entropy Beacon Explorer</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="style.css" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = JSON.parse(localStorage.getItem('drand-explorer:v1') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">◈</span>
        <div>
          <h1>Entropy Beacon Explorer</h1>
          <p>Public randomness beacons · drand · NIST · INMETRO</p>
        </div>
      </div>
      <div class="controls">
        <label>
          <span>Command format</span>
          <select id="outputMode">
            <option value="url">URL</option>
            <option value="curl">cURL</option>
            <option value="wget">wget</option>
            <option value="cli">drand CLI</option>
          </select>
        </label>
        <button type="button" id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">◐</button>
      </div>
    </header>

    <div class="statusbar" id="status" role="status">Loading beacons…</div>

    <div class="layout">
      <nav class="sidebar" aria-label="Beacons">
        <section class="group">
          <h2>drand</h2>
          <label class="network">
            <span>Network</span>
            <select id="endpointSelect" aria-label="drand network"></select>
          </label>
          <ul id="listDrand" class="beacon-list"></ul>
        </section>
        <section class="group">
          <h2>NIST (USA)</h2>
          <ul id="listNist" class="beacon-list"></ul>
        </section>
        <section class="group">
          <h2>INMETRO (Brazil)</h2>
          <ul id="listInmetro" class="beacon-list"></ul>
        </section>
      </nav>
      <main id="detail" class="detail" aria-live="polite"></main>
    </div>

    <footer class="footer">
      <a href="https://github.com/jimmckeeth/entropy-beacon-explorer" target="_blank" rel="noopener">Use the source</a>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
